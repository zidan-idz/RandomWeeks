# ============================================================
# KONFIGURASI UTAMA JEKYLL
# ============================================================
# File ini mengatur setelan global situs.
# Restart server jika mengubah file ini.

# --- Identitas Situs ---
title: "RandomWeeks"
email: "zeyshyy@gmail.com"
description: >-
  "Tidak selalu penting, tapi selalu nyata. Ruang sederhana untuk menulis hal-hal acak, 
  tentang ide, perasaan, dan hal-hal kecil yang membuat hidup terasa nyata."
baseurl: "" # Subpath situs (kosongkan jika di root)
url: "https://randomweeks.netlify.app" # Domain utama
keywords: ["blog", "randomweeks", "opini", "zidan", "teknologi", "kehidupan"]
image: "/assets/images/main/favicon.webp"

# --- Sosial Media ---
facebook_username: "muhammadraidzaidani"
github_username: "zidan-idz"
twitter_username: "Zidan_IDz" # Atau ganti username Twitter/X yang benar di sini

# --- Pengaturan Build ---
plugins:
  - "jekyll-feed"
  - "jekyll-seo-tag"
  - "jekyll-sitemap"
  - "jekyll-paginate-v2"
  - "jekyll-minifier"

# --- Pengaturan Autopages (Paginasi per Tag) ---
autopages:
  enabled: true
  tags:
    layouts: 
      - 'tag.html'
    title: 'Tag: :tag'
    permalink: '/tag/:tag'
  categories:
    enabled: false
  collections:
    enabled: false

# --- Verifikasi ---
google_site_verification: "Vqjmpdv9-fM1mi2_EjDiTk4d3ZFzxpYrrAvVPVHW1yU"

# Layout default untuk semua halaman
layout: "default"

# --- Nilai Default (Front Matter) ---
defaults:
  - scope:
      path: "" # Berlaku untuk semua file
      type: posts
    values:
      author: Zidan IDz

# --- Pengecualian (Exclude) ---
# Folder/file ini tidak akan diproses oleh Jekyll
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/

# --- Pengaturan Kompresi SASS ---
sass:
  style: compressed

# --- Pengaturan Paginasi ---
pagination:
  enabled: true
  per_page: 8
  permalink: '/page/:num/'
  title: ':title - Halaman :num'
  sort_field: 'date'
  sort_reverse: true


